---
name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  golangci:
    name: pull-kafka-exporter-golang-ci
    env:
      GOPATH: ${{ github.workspace }}
      GO111MODULE: on
    defaults:
      run:
        working-directory: ${{ env.GOPATH }}/src/github.com/${{ github.repository }}
    strategy:
      max-parallel: 3
      matrix:
        go-version: ["1.23.1"]
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Install Go
        uses: actions/setup-go@v4
        with:
          go-version: ${{ matrix.go-version }}
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 1
          path: ${{ env.GOPATH }}/src/github.com/${{ github.repository }}
      - name: Golang Format
        run: |
          make fmt
          STATUS=$(git status --porcelain go.mod go.sum)
          if [ ! -z "$STATUS" ]; then
            echo "Running 'make fmt' to format your codes"
            exit 1
          fi
      - name: Golang Lint
        run: make lint
      - name: Golang Vet
        run: make vet
      - name: Tidy Go Module
        run: |
          echo "Verifying if there is any unused dependency in go module"
          make tidy
          STATUS=$(git status --porcelain go.mod go.sum)
          if [ ! -z "$STATUS" ]; then
            echo "Running 'make tidy' to fix your 'go.mod' and/or 'go.sum'"
            exit 1
          fi
          echo "Go module is tidy."
      - name: Build Binaries
        run: |
          mkdir -p ${{ github.workspace }}/output
          make build
          mv ./build/* ${{ github.workspace }}/output
      - name: Upload Binaries
        uses: actions/upload-artifact@v4
        with:
          name: kafka-exporter-binaries
          path: |
            ${{ github.workspace }}/output